configuration:
  application-tag: 0.0.3-api-test-demo
  database:
    name: libdemo
    password: postgres
  api:
    schema: http
    host: localhost
    port: 8080
    path: /api
    username:
      user: default_user
      manager: manager
      librarian: default_librarian
      admin: admin
    default_password: password
spring:
  data:
    redis:
      host: localhost
      connect-timeout: 3s
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:15432/libdemo
    username: postgres
    password: postgres
  main:
    banner-mode: off
